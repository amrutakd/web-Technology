<html>
    <head>
        <title>Change content of page</title>
    </head>

    <body>
        <p id="demo">Hello World!!</p>
        <img id="image" src="smile.jpeg" width="160" height="120">
        <script>
            document.getElementById("demo").innerHTML="New Image !!";
            document.getElementById("image").src="nature.jpeg"
        </script>
        <p>The above paragraph text changed by a script</p>
        <p>the original image of smile is changed by nature image</p>
    </body>
</html>
