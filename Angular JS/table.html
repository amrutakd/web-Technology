<!DOCTYPE html>
<html lang="en" ng-app="simpleApp">
<head>
    <title>Table in Angularjs</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.4/angular.min.js"></script>
    <script src="table.js"></script>
</head>
<body>
    <div ng-controller="simplectrl">
        <table border=1 cellspacing="0">
            <tr>
                <th>No.</th>
                <th>Name</th>
                <th>City</th>
            </tr>
            <tr ng-repeat="entry in collection">
                <td>{{$index+1}} </td>
                <td>{{entry.name}} </td>
                <td>{{entry.city}} </td>
            </tr>
        </table><br><br>

        <form ng-submit="addEntry()">
            <h1>New Data Entry Form</h1>
            Name:<input type="text" ng-model="newData.name" required>
            City:<input type="text" ng-model="newData.city" required><br><br>
            <input type="submit" value="Add Entry">
        </form>
    </div>
</body>
</html>
